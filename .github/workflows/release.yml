# Push a tag such as v0.2.0 and this builds and packages Shotput. It publishes a GitHub release
# only when it can sign and notarize, using these repository secrets:
#   DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD, DEVELOPER_ID_NAME
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD
#   SPARKLE_PRIVATE_KEY (from `generate_keys --account shotput -x key.txt`), for the update feed
# Without them the build is kept as a workflow artifact and no release is touched, so a tag
# pushed by Scripts/release.sh never has its notarized files replaced by unsigned ones.
#
# Tags with a hyphen (v0.2.0-beta.1) become pre-releases. An existing release keeps its files
# unless you run this by hand from the Actions tab with "replace" ticked.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.2.0
        required: true
      replace:
        description: Replace the files of an existing release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.NOTARY_PASSWORD != '' && secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check
        run: |
          swift run shotput-dev editor "$RUNNER_TEMP/editor.png"
          swift run shotput-dev overlay "$RUNNER_TEMP/overlay.png"
          swift run shotput-dev settings "$RUNNER_TEMP/settings.png"

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        if: env.P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        env:
          SHOTPUT_VERSION: ${{ env.TAG }}
          SHOTPUT_UNIVERSAL: "1"
          SHOTPUT_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_NAME || '-' }}
        run: ./Scripts/build.sh

      - name: Package
        env:
          SHOTPUT_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_NAME || '-' }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./Scripts/package.sh

      - name: Update feed
        if: env.SIGNED == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${TAG#v}"
          FEED_DIR="$(mktemp -d)"
          cp "build/Shotput-$VERSION.zip" "$FEED_DIR/"
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - \
            --download-url-prefix "https://github.com/keshav-exe/shotput/releases/download/$TAG/" \
            --full-release-notes-url "https://github.com/keshav-exe/shotput/releases/tag/$TAG" \
            -o build/appcast.xml "$FEED_DIR"

      - name: Keep the unsigned build
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Shotput-${{ env.TAG }}-unsigned
          path: |
            build/Shotput-*.dmg
            build/Shotput-*.zip
            build/checksums.txt

      - name: Publish
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace && 'true' || 'false' }}
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$REPLACE" != "true" ]; then
              echo "Release $TAG already exists. Leaving its files alone."
              exit 0
            fi
            gh release upload "$TAG" build/Shotput-$VERSION.dmg build/Shotput-$VERSION.zip build/checksums.txt build/appcast.xml Scripts/install.sh --clobber
          else
            FLAGS=""
            case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
            gh release create "$TAG" $FLAGS --title "Shotput $VERSION" --generate-notes --verify-tag \
              build/Shotput-$VERSION.dmg build/Shotput-$VERSION.zip build/checksums.txt build/appcast.xml Scripts/install.sh
          fi
